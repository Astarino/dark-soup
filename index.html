<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120d0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dark Soup</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Play:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0806; --panel:#1c140d; --edge:#0c0906; --rim:#6b4724; --rim2:#3a2614; --text:#f3e6cf;
    --muted:#bfa98a; --accent:#f0a040;
    --px:'Press Start 2P',monospace; --body:'Play',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:var(--body);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges}
  #game{display:block;position:fixed;left:0;top:0;touch-action:none}
  #safe{position:fixed;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #pauseBtn{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(24px + env(safe-area-inset-top));
    width:44px;height:44px;border:0;background:var(--panel);color:var(--text);display:none;cursor:pointer;z-index:5;
    box-shadow:0 0 0 3px var(--edge),inset 0 0 0 3px var(--rim),inset 0 0 0 5px var(--rim2)}
  #pauseBtn .menuLines{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%}
  #pauseBtn .menuLines i{display:block;width:20px;height:3px;background:#f4cf8d;box-shadow:2px 2px 0 #6c3a17}
  #pauseBtn:hover,#pauseBtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;
    background:rgba(6,4,2,.72);z-index:10}
  .overlay.show{display:flex}
  .panel{background:var(--panel);padding:24px 20px;width:min(440px,100%);text-align:center;
    box-shadow:0 0 0 4px var(--edge),inset 0 0 0 4px var(--rim),inset 0 0 0 7px var(--rim2),0 12px 0 4px rgba(0,0,0,.45)}
  .panel.wide{width:min(780px,100%)}
  .panel.catalog{width:min(900px,100%);max-height:calc(100dvh - 32px);overflow:auto;text-align:left;touch-action:pan-y;overscroll-behavior:contain}
  .panel.catalog h2{text-align:center}
  h1{margin:4px 0 14px;font:clamp(22px,7vw,34px)/1.3 var(--px);color:var(--accent);text-shadow:3px 3px 0 #6e2d0e,-2px -2px 0 #1a0e06}
  h2{margin:4px 0 10px;font:18px/1.4 var(--px);color:var(--accent);text-shadow:2px 2px 0 #6e2d0e}
  p{margin:6px 0 14px;color:var(--muted);line-height:1.35;font-size:18px}
  .hint{font-size:15px;color:#9c8a70}
  .panel button{appearance:none;border:0;padding:14px 18px;margin:10px 6px 2px;background:#d9772b;color:#2a1406;
    font:12px/1.2 var(--px);cursor:pointer;
    box-shadow:0 0 0 3px var(--edge),inset -4px -4px 0 #9a4a18,inset 4px 4px 0 #f7b068}
  .panel button:active{box-shadow:0 0 0 3px var(--edge),inset 4px 4px 0 #9a4a18,inset -4px -4px 0 #f7b068}
  .panel button.ghost{background:#2a1e14;color:var(--muted);box-shadow:0 0 0 3px var(--edge),inset -4px -4px 0 #1a120a,inset 4px 4px 0 #4a3624}
  .panel button.small{font-size:9px;padding:12px 14px}
  #languageChoices,#soundChoices{display:flex;justify-content:center;gap:12px;margin:8px 0 20px}
  #languageChoices button,#soundChoices button{min-width:100px}
  #languageChoices button.selected,#soundChoices button.selected{background:#759542;color:#101308;box-shadow:0 0 0 3px var(--edge),inset -4px -4px 0 #465c27,inset 4px 4px 0 #a8cf67}
  .catalogSection{margin:18px 0 24px}
  .catalogSection h3{margin:0 0 10px;color:var(--accent);font:10px/1.5 var(--px)}
  .catalogGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .catalogCard{min-height:86px;background:#241a12;padding:12px;box-shadow:inset 0 0 0 2px #4e3824;display:flex;gap:10px;align-items:flex-start}
  .catalogCard .catalogIcon{width:36px;height:36px;flex:none;image-rendering:pixelated}
  .catalogCard b{display:block;margin-bottom:5px;color:#ffe0b0;font:9px/1.5 var(--px)}
  .catalogCard p{margin:0;font-size:16px;line-height:1.25}
  .catalogCard .meta{display:block;margin-top:6px;color:#9b805f;font-size:14px}
  .recipeBookCover{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    width:min(320px,100%);min-height:200px;margin:16px auto 10px!important;padding:18px!important;
    background:#6b3219!important;color:#ffdf9a!important;text-align:center;cursor:pointer;
    box-shadow:0 0 0 4px #0c0906,inset 0 0 0 5px #9d622d,inset 0 0 0 9px #3b1c0d,8px 8px 0 #24150d!important}
  .recipeBookCover::before{content:"";position:absolute;left:10px;top:9px;bottom:9px;width:9px;background:repeating-linear-gradient(to bottom,#28150d 0 9px,#ad7740 9px 13px)}
  .recipeBookCover:hover,.recipeBookCover:focus-visible{transform:translateY(-3px);outline:3px solid #f0a040;outline-offset:6px}
  .recipeBookCover .coverOrnament{font:10px var(--px);color:#e5ab64;letter-spacing:4px}
  .recipeBookCover .coverIcons{display:flex;gap:14px;align-items:center;margin:2px 0}
  .recipeBookCover .coverIcons canvas{width:42px;height:42px;image-rendering:pixelated}
  .recipeBookCover .coverTitle{max-width:220px;font:13px/1.7 var(--px);color:#ffe1a0;text-shadow:2px 2px #321405}
  .recipeBookCover .coverHint{font:8px/1.6 var(--px);color:#dbaa6c}
  .bookOverlay{z-index:12}
  .bookShell{width:min(900px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;gap:12px}
  .bookHeader,.bookFooter{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#f2c98b}
  .bookHeader h2{margin:0;font:clamp(11px,2.5vw,16px)/1.5 var(--px)}
  .bookHeader button,.bookFooter button{margin:0!important;padding:10px 12px!important;min-height:42px;
    border:0;background:#4a2a18;color:#ffe0ad;font:10px/1.4 var(--px);cursor:pointer;
    box-shadow:inset 0 0 0 3px #81502c,3px 3px 0 #0b0704}
  .bookHeader button:hover,.bookFooter button:hover,.bookHeader button:focus-visible,.bookFooter button:focus-visible{outline:2px solid var(--accent)}
  .bookFooter button:disabled{opacity:.42;cursor:default}
  .bookSpread{display:grid;grid-template-columns:1fr 1fr;min-height:min(500px,calc(100dvh - 150px));
    background:#3e2415;padding:10px;box-shadow:0 0 0 4px #0c0906,7px 8px 0 #1a0e08}
  .bookPage{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 24px 22px;overflow:auto;
    background:repeating-linear-gradient(to bottom,#ebd4a1 0 31px,#dfc48e 31px 32px);color:#362212;
    box-shadow:inset 0 0 0 4px #c99e66,inset 0 0 0 8px #ead3a1}
  .bookPage:first-child{border-right:5px solid #9c6c3d;box-shadow:inset 0 0 0 4px #c99e66,inset 0 0 0 8px #ead3a1,inset -10px 0 14px -10px #38200e}
  .bookPage:last-child{border-left:5px solid #9c6c3d;box-shadow:inset 0 0 0 4px #c99e66,inset 0 0 0 8px #ead3a1,inset 10px 0 14px -10px #38200e}
  .bookPage .pageNumber{align-self:flex-end;font:9px var(--px);color:#866139}
  .bookPage .pageIcon{width:84px;height:84px;flex:none;image-rendering:pixelated;filter:drop-shadow(4px 4px 0 #bb9665)}
  .bookPage .pageCategory{font:9px/1.6 var(--px);color:#8a431d;text-align:center}
  .bookPage h3{margin:0;text-align:center;font:clamp(11px,2vw,16px)/1.6 var(--px);color:#472412}
  .bookPage p{max-width:310px;margin:2px 0;text-align:center;color:#493321;font:clamp(17px,2vw,21px)/1.3 var(--body)}
  .bookPage .pageRank{margin-top:auto;padding-top:12px;font:9px/1.6 var(--px);text-align:center;color:#76512c}
  .bookFooter span{font:9px/1.5 var(--px);text-align:center}
  .settingsActions{text-align:center}
  #cards{display:flex;gap:16px;margin-top:14px;padding:4px}
  .panel .card{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin:0;
    background:#2e2016;color:var(--text);padding:14px 10px 12px;font:16px/1.3 var(--body);
    box-shadow:0 0 0 3px var(--edge),inset -3px -3px 0 #1c140c,inset 3px 3px 0 #4e3824}
  .panel .card:hover,.panel .card:focus-visible{outline:none;background:#3c2a1a;
    box-shadow:0 0 0 3px var(--accent),inset -3px -3px 0 #1c140c,inset 3px 3px 0 #5e4430}
  .card canvas{width:48px;height:48px;flex:none}
  .card .nm{font:11px/1.4 var(--px);color:#ffe0b0}
  .card .tag{font:9px/1 var(--px);padding:5px 6px;background:#5a2f12;color:#ffbf78;align-self:center}
  .card .tag.new{background:#2d5a1a;color:#bff29a}
  .card .ds{color:var(--muted);font-size:16px;line-height:1.25}
  .card .key{font:8px var(--px);color:#7d6a52}
  @media (max-width:640px){
    #cards{flex-direction:column;gap:12px}
    .panel .card{flex-direction:row;text-align:left;gap:12px}
    .card .txt{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
    .card .tag{align-self:flex-start}
    .card .key{display:none}
    .bookSpread{display:block;min-height:0;height:min(480px,calc(100dvh - 150px))}
    .bookPage{height:100%;padding:20px 18px}
    .bookPage:last-child{display:none}
    .bookPage:first-child{border:0}
    .bookHeader button,.bookFooter button{font-size:8px}
  }
  @media (min-width:641px){ .card .txt{display:contents} }
  /* Скрытый переключатель вида и настройки первого лица */
  #viewChangeBtn{margin-top:4px!important;min-height:44px;font-size:10px!important;text-transform:none}
  #viewStatus{min-height:22px;margin:10px 0 0;text-align:center;font-size:16px;color:#bfa98a}
  #viewStatus.err{color:#ff8a70}
  .fpSettings{margin:16px 0 4px;padding:12px 12px 4px;background:#170f09;box-shadow:inset 0 0 0 2px #33241a}
  .fpSettings h3{margin:0 0 6px;color:var(--accent);font:10px/1.5 var(--px);text-align:center}
  .fpSettings .choices{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0 14px}
  .fpSettings .choices button{min-width:90px}
  .fpSettings .choices button.selected{background:#759542;color:#101308;box-shadow:0 0 0 3px var(--edge),inset -4px -4px 0 #465c27,inset 4px 4px 0 #a8cf67}
  .fpSettings .slider{margin:8px 0}
  .fpSettings .note{margin:4px 0 10px;font-size:15px;text-align:center}
  #codeModal{z-index:14;align-items:flex-start;padding-top:min(18vh,120px)}
  #codeModal .panel{width:min(360px,100%)}
  #codeModal h2{margin-bottom:6px}
  #codeInput{display:block;width:100%;margin:12px 0 4px;padding:14px 12px;border:0;background:#0f0a06;color:#ffe0b0;
    font:22px/1 var(--px);letter-spacing:6px;text-align:center;outline:none;-webkit-user-select:text;user-select:text;
    box-shadow:0 0 0 3px var(--edge),inset 0 0 0 2px #3a2a1c}
  #codeInput:focus-visible{box-shadow:0 0 0 3px var(--accent),inset 0 0 0 2px #3a2a1c}
  #codeInput[aria-invalid="true"]{box-shadow:0 0 0 3px #d8452e,inset 0 0 0 2px #6a1a10}
  #codeError{min-height:24px;margin:6px 0 4px;font-size:17px;color:#ff8a70}
  #codeModal .actions{display:flex;justify-content:center;gap:12px}
  #codeModal .actions button{margin:6px 0 0;min-width:120px}
  #codeModal.shake .panel{animation:codeShake .28s}
  @keyframes codeShake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @media (prefers-reduced-motion:reduce){#codeModal.shake .panel{animation:none}}
  /* Единые кнопки меню: одинаковый размер и вид */
  .menuButtons{display:flex;flex-direction:column;gap:12px;margin-top:16px}
  .menuButtons.two{display:grid;grid-template-columns:1fr 1fr}
  .menuButtons.two>:last-child:nth-child(odd){grid-column:1/-1}
  .panel .menuBtn{display:block;width:100%;min-height:50px;margin:0;padding:14px 12px;font:12px/1.2 var(--px)}
  /* Главное меню поверх живой сцены лагеря */
  #menu{background:none;justify-content:flex-end;align-items:center;padding:24px max(24px,4vw);transition:opacity .45s}
  #menu.leaving{opacity:0;pointer-events:none}
  #menu .panel{width:min(360px,100%);background:rgba(28,20,13,.9)}
  #menu h1{margin-top:0}
  @media (max-aspect-ratio:1/1){ #menu{justify-content:center;align-items:flex-end;padding:16px 16px calc(20px + env(safe-area-inset-bottom))} #menu .panel{width:min(420px,100%)} #menu p#menuIntro{display:none} }
  /* Окна статистики, звука и состояния супа */
  .panel.info{width:min(760px,100%);max-height:calc(100dvh - 32px);overflow:auto;text-align:left;overscroll-behavior:contain}
  .panel.info h2{text-align:center}
  .infoSection{margin:18px 0 6px}
  .infoSection h3{margin:0 0 10px;color:var(--accent);font:10px/1.5 var(--px)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
  .tile{background:#140e08;padding:10px 8px;box-shadow:inset 0 0 0 2px #2e2016;text-align:center}
  .tile b{display:block;font:14px/1.5 var(--px);color:#ffe0b0}
  .tile span{font-size:15px;color:var(--muted)}
  .rows{display:flex;flex-direction:column;gap:6px}
  .row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:#211710;padding:6px 10px;box-shadow:inset 0 0 0 2px #33241a}
  .row canvas,.row .dot{display:block;width:24px;height:24px;image-rendering:pixelated}
  .row .dot{width:14px;height:14px;margin:5px;box-shadow:0 0 0 2px var(--edge)}
  .row .name{font-size:16px;color:#f3e6cf;min-width:0}
  .row .name small{display:block;color:var(--muted);font-size:14px}
  .row .val{font:10px/1.4 var(--px);color:#ffe0b0;text-align:right;white-space:nowrap}
  .bar{height:6px;margin-top:4px;background:#0f0a06;box-shadow:inset 0 0 0 1px #3a2a1c}
  .bar i{display:block;height:100%;background:linear-gradient(#f3a34a,#c05a1e)}
  .pips{font:9px/1 var(--px);letter-spacing:2px;color:#f0a040}
  .pips em{color:#4a3624;font-style:normal}
  .recipeIcons{display:flex;flex-wrap:wrap;gap:8px}
  .recipeIcons span{position:relative;display:block;width:40px;height:40px;background:#241a10;box-shadow:inset 0 0 0 2px #4e3824}
  .recipeIcons canvas{position:absolute;inset:4px;width:32px;height:32px;image-rendering:pixelated}
  .recipeIcons b{position:absolute;right:2px;bottom:1px;font:8px var(--px);color:#ffd98a;text-shadow:1px 1px #000}
  .badge{display:inline-block;margin:0 auto 8px;padding:6px 10px;font:9px/1.4 var(--px);background:#2d5a1a;color:#bff29a}
  .emptyNote{text-align:center;color:var(--muted);font-size:17px;margin:24px 0}
  .slider{display:grid;grid-template-columns:120px 1fr 56px;gap:12px;align-items:center;margin:14px 0}
  .slider label{font:9px/1.4 var(--px);color:#ffe0b0}
  .slider output{font:10px var(--px);color:var(--accent);text-align:right}
  .slider input{-webkit-appearance:none;appearance:none;width:100%;height:12px;background:#0f0a06;box-shadow:0 0 0 3px var(--edge),inset 0 0 0 2px #3a2a1c;outline:none}
  .slider input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:24px;background:#d9772b;box-shadow:0 0 0 3px var(--edge),inset -3px -3px 0 #9a4a18,inset 3px 3px 0 #f7b068;cursor:pointer}
  .slider input::-moz-range-thumb{width:18px;height:24px;border:0;border-radius:0;background:#d9772b;box-shadow:0 0 0 3px var(--edge);cursor:pointer}
  @media (max-width:640px){ .slider{grid-template-columns:1fr 56px} .slider label{grid-column:1/-1} .menuButtons.two{grid-template-columns:1fr} }
  /* Таблица уровней в книге рецептов */
  .bookPage .levels{width:100%;max-width:340px;border-collapse:collapse;font:13px/1.3 var(--body);color:#3b2614}
  .bookPage .levels th{font:7px/1.4 var(--px);color:#8a431d;text-align:center;padding:3px 2px;border-bottom:2px solid #c99e66}
  .bookPage .levels td{text-align:center;padding:3px 2px;border-bottom:1px solid #d9bb86}
  .bookPage .levels td:first-child{font:8px var(--px);color:#76512c}
  .bookPage .how{font-size:clamp(15px,1.8vw,18px)!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<button id="pauseBtn" type="button" aria-label="Пауза"><span class="menuLines" aria-hidden="true"><i></i><i></i><i></i></span></button>

<div id="menu" class="overlay show">
  <div class="panel">
    <h1>DARK SOUP</h1>
    <p id="menuIntro"></p>
    <div class="menuButtons">
      <button id="startBtn" class="menuBtn"></button>
      <button id="statsBtn" class="menuBtn"></button>
      <button id="menuSoundBtn" class="menuBtn"></button>
      <button id="menuSettingsBtn" class="menuBtn"></button>
    </div>
    <p class="hint" id="menuHint"></p>
  </div>
</div>

<div id="levelup" class="overlay">
  <div class="panel wide">
    <h2 id="luTitle">Новый уровень!</h2>
    <p id="luSub">Брось добавку в суп</p>
    <div id="cards"></div>
  </div>
</div>

<div id="pause" class="overlay">
  <div class="panel info">
    <h2 id="pauseTitle"></h2>
    <div id="soupState"></div>
    <div class="menuButtons two">
      <button id="resumeBtn" class="menuBtn"></button>
      <button id="pauseSoundBtn" class="menuBtn"></button>
      <button id="pauseSettingsBtn" class="menuBtn"></button>
      <button id="quitBtn" class="menuBtn"></button>
      <button id="pauseMenuBtn" class="menuBtn"></button>
    </div>
  </div>
</div>

<div id="over" class="overlay">
  <div class="panel info">
    <h2 id="overTitle"></h2>
    <div id="runSummary"></div>
    <div class="menuButtons two">
      <button id="restartBtn" class="menuBtn"></button>
      <button id="overMenuBtn" class="menuBtn"></button>
    </div>
  </div>
</div>

<div id="soundPanel" class="overlay">
  <div class="panel info">
    <h2 id="soundTitle"></h2>
    <div id="soundChoices">
      <button id="soundOnBtn" class="small"></button>
      <button id="soundOffBtn" class="small"></button>
    </div>
    <div class="slider"><label id="volFireLabel" for="volFire"></label><input id="volFire" type="range" min="0" max="100" step="5"><output id="volFireOut"></output></div>
    <div class="slider"><label id="volMobsLabel" for="volMobs"></label><input id="volMobs" type="range" min="0" max="100" step="5"><output id="volMobsOut"></output></div>
    <div class="slider"><label id="volHitsLabel" for="volHits"></label><input id="volHits" type="range" min="0" max="100" step="5"><output id="volHitsOut"></output></div>
    <p class="hint" id="soundHint" style="text-align:center"></p>
    <div class="menuButtons"><button id="soundBackBtn" class="menuBtn"></button></div>
  </div>
</div>

<div id="statsPanel" class="overlay">
  <div class="panel info">
    <h2 id="statsTitle"></h2>
    <div id="statsContent"></div>
    <div class="menuButtons"><button id="statsBackBtn" class="menuBtn"></button></div>
  </div>
</div>

<div id="settings" class="overlay">
  <div class="panel catalog">
    <h2 id="settingsTitle"></h2>
    <h3 id="languageTitle" style="text-align:center"></h3>
    <div id="languageChoices">
      <button id="ruBtn" class="small"></button>
      <button id="enBtn" class="small"></button>
    </div>
    <div class="catalogSection">
      <h3 id="enemyTitle"></h3>
      <div id="enemyList" class="catalogGrid"></div>
    </div>
    <div class="catalogSection">
      <h3 id="recipeTitle"></h3>
      <button id="recipeBookBtn" class="recipeBookCover" type="button">
        <span class="coverOrnament" aria-hidden="true">✦ ✦ ✦</span>
        <span class="coverIcons" aria-hidden="true"><canvas width="12" height="12"></canvas><canvas width="12" height="12"></canvas><canvas width="12" height="12"></canvas></span>
        <span id="recipeCoverTitle" class="coverTitle"></span>
        <span id="recipeCoverHint" class="coverHint"></span>
      </button>
    </div>
    <div id="fpSettings" class="fpSettings" hidden>
      <h3 id="fpTitle"></h3>
      <div class="slider"><label id="fpSensLabel" for="fpSens"></label><input id="fpSens" type="range" min="0.2" max="3" step="0.1"><output id="fpSensOut"></output></div>
      <div id="fpSwayChoices" class="choices">
        <button id="fpSwayOn" class="small" type="button"></button>
        <button id="fpSwayOff" class="small" type="button"></button>
      </div>
      <h3 id="fpQualityTitle"></h3>
      <div id="fpQualityChoices" class="choices">
        <button id="fpQHigh" class="small" type="button"></button>
        <button id="fpQMedium" class="small" type="button"></button>
        <button id="fpQLow" class="small" type="button"></button>
      </div>
      <p class="hint note" id="fpControlsHint"></p>
    </div>
    <div class="menuButtons">
      <button id="viewChangeBtn" class="menuBtn ghost" type="button">change</button>
      <p id="viewStatus" role="status" aria-live="polite"></p>
      <button id="settingsBackBtn" class="menuBtn"></button>
    </div>
  </div>
</div>

<div id="codeModal" class="overlay" role="dialog" aria-modal="true" aria-labelledby="codeTitle" aria-describedby="codeError">
  <div class="panel">
    <h2 id="codeTitle"></h2>
    <input id="codeInput" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="12" aria-label="code">
    <p id="codeError" role="alert"></p>
    <div class="actions">
      <button id="codeOkBtn" type="button"></button>
      <button id="codeCancelBtn" class="ghost" type="button"></button>
    </div>
  </div>
</div>

<div id="recipeBook" class="overlay bookOverlay" role="dialog" aria-modal="true" aria-labelledby="bookTitle">
  <div class="bookShell">
    <div class="bookHeader"><h2 id="bookTitle"></h2><button id="bookCloseBtn" type="button"></button></div>
    <div class="bookSpread"><article id="bookLeftPage" class="bookPage"></article><article id="bookRightPage" class="bookPage"></article></div>
    <div class="bookFooter"><button id="bookPrevBtn" type="button"></button><span id="bookCounter"></span><button id="bookNextBtn" type="button"></button></div>
  </div>
</div>

<script>
if (location.protocol === 'file:') {
  document.getElementById('menuIntro').textContent = 'Запустите «Запустить игру.command» или npm start и откройте http://localhost:5173. ES-модулям нужен локальный сервер.';
}
</script>
<script type="module" src="game.js"></script>
</body>
</html>
